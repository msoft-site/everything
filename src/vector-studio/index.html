<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Vector Studio — 矢量图形工作室</title>
  <meta name="description" content="矢量插画编辑器：提供钢笔与形状工具、路径查找器、渐变、文字、画板与图层功能，支持导出 SVG、PDF 和 PNG。文件保存在本地存储。" />
  <link rel="canonical" href="https://ves.puter.com/" />
  <meta name="theme-color" content="#f3f3f3" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#2b2b2b" media="(prefers-color-scheme: dark)" />
  <meta name="color-scheme" content="light dark" />
  <link rel="icon" href="./favicon-32x32.png" type="image/png" sizes="32x32" />
  <link rel="icon" href="./favicon-16x16.png" type="image/png" sizes="16x16" />
  <link rel="apple-touch-icon" href="./apple-touch-icon.png" sizes="180x180" />
  <link rel="manifest" href="./manifest.json" />
  <script>
    // Apply the saved theme before first paint so there is no flash.
    (() => {
      let t = 'system';
      try { t = localStorage.getItem('vector-studio:theme') || 'system'; } catch {}
      const levels = ['dark', 'medium-dark', 'medium-light', 'light'];
      if (!levels.includes(t)) t = 'system';
      const dark = t === 'system' ? matchMedia('(prefers-color-scheme: dark)').matches : t.endsWith('dark');
      const root = document.documentElement;
      root.dataset.theme = t;
      root.dataset.themeResolved = dark ? 'dark' : 'light';
      root.dataset.brightness = t === 'system' ? (dark ? 'dark' : 'light') : t;
    })();
  </script>
  <script src="https://js.puter.com/v2/" defer></script>
  <!-- Privacy-friendly analytics by Plausible -->
  <script async src="https://plausible.io/js/pa-H2qCOm4UViEitsniXgmWz.js"></script>
  <script>
    window.plausible=window.plausible||function(){(plausible.q=plausible.q||[]).push(arguments)},plausible.init=plausible.init||function(i){plausible.o=i||{}};
    plausible.init()
  </script>
  <script type="module" src="/src/main.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">跳转到画布</a>
  <div id="app" class="app" aria-busy="true"></div>
  <div id="live-region" class="sr-only" aria-live="polite" aria-atomic="true"></div>
</body>
</html>
