<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- 1200x630 (1.91:1) is the ratio Facebook, LinkedIn, Slack, and X's

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="在线玩国际象棋 — 对战电脑或好友" />
    <meta name="twitter:description" content="在浏览器中免费畅玩国际象棋。挑战电脑、在同一设备上同屏对战，或邀请好友进行私人在线对局。" />
    <meta name="twitter:image" content="https://chess.puter.com/og-image.png" />
    <meta name="twitter:image:alt" content="在线玩国际象棋 — 浏览器内免费畅玩。展示将死局面的国际象棋棋盘。" />
    <link rel="icon" href="favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
    <link rel="manifest" href="site.webmanifest" />
    <meta name="theme-color" content="#f4f5f9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#13151b" media="(prefers-color-scheme: dark)" />
    <title>在线玩国际象棋 — 对战电脑或好友</title>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": ["WebApplication", "VideoGame"],
        "name": "国际象棋 — 在线畅玩",
        "url": "https://chess.puter.com/",
        "description": "在浏览器中免费畅玩国际象棋。挑战电脑、在同一设备上与好友同屏对战，或邀请好友进行私人在线对局。",
        "applicationCategory": "GameApplication",
        "operatingSystem": "Any",
        "browserRequirements": "Requires JavaScript",
        "genre": "Board game",
        "gamePlatform": "Web browser",
        "playMode": ["SinglePlayer", "MultiPlayer"],
        "image": "https://chess.puter.com/icon-512.png",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        }
      }
    </script>
    <script>
      // Resolve the theme before first paint to avoid a flash. main.js keeps
      // the attribute in sync afterwards; "system" follows the OS setting.
      (function () {
        var theme;
        try {
          theme = (JSON.parse(localStorage.getItem('chess-settings')) || {}).theme;
        } catch (e) {
          /* fall through to system */
        }
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches
            ? 'dark'
            : 'light';
        }
        document.documentElement.dataset.theme = theme;
      })();
    </script>
    <!-- Privacy-friendly analytics by Plausible -->
    <script async src="https://plausible.io/js/pa-wKhkwB5oGmJ0GlsSr-Bun.js"></script>
    <script>
      window.plausible=window.plausible||function(){(plausible.q=plausible.q||[]).push(arguments)},plausible.init=plausible.init||function(i){plausible.o=i||{}};
      plausible.init()
    </script>
  </head>
  <body>
    <noscript>
      <p class="noscript-note">
        这款国际象棋游戏完全在您的浏览器中运行，需要启用 JavaScript 才能使用。请启用 JavaScript 以挑战电脑、在同一设备上与好友同屏对战，或开始私人在线对局。
      </p>
    </noscript>
    <div id="app">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark"><img src="icon-128.png" alt="" width="128" height="128" /></span>
          <h1 class="brand-name">国际象棋<span class="visually-hidden"> — 在浏览器中免费与电脑或好友对战</span></h1>
        </div>
        <div class="topbar-right">
          <span class="topbar-note" id="topbar-note">人机对战</span>
          <div class="theme-toggle" role="group" aria-label="主题">
            <button type="button" data-theme-choice="light" title="浅色主题" aria-label="浅色主题">
              <i data-lucide="sun"></i>
            </button>
            <button type="button" data-theme-choice="dark" title="深色主题" aria-label="深色主题">
              <i data-lucide="moon"></i>
            </button>
            <button type="button" data-theme-choice="system" title="跟随系统主题" aria-label="跟随系统主题">
              <i data-lucide="monitor"></i>
            </button>
          </div>
        </div>
      </header>

      <main class="layout">
        <section class="board-column">
          <div class="board-frame">
            <div id="board" class="board" role="grid" aria-label="国际象棋棋盘"></div>
          </div>
        </section>

        <aside class="sidebar">
          <div class="mode-switch" role="group" aria-label="游戏模式">
            <button type="button" data-mode="computer" aria-pressed="true">
              <i data-lucide="cpu"></i>电脑
            </button>
            <button type="button" data-mode="local" aria-pressed="false">
              <i data-lucide="users"></i>同屏对战
            </button>
            <button type="button" data-mode="online" aria-pressed="false">
              <i data-lucide="globe"></i>在线
            </button>
          </div>

          <div id="result-banner" class="result-banner hidden"></div>

          <section class="card online-card hidden" id="online-card" aria-label="在线对局设置">
            <div class="online-section" id="online-idle">
              <h2 class="card-title">与好友对战</h2>
              <p class="online-note" id="online-invite-note" hidden>
                您收到了对局邀请 — 点击“加入”以连接。
              </p>
              <button class="btn btn-primary btn-block" id="host-btn" type="button">
                <i data-lucide="plus"></i><span id="host-btn-label">创建对局</span>
              </button>
              <div class="online-divider" aria-hidden="true"><span>或使用邀请码加入</span></div>
              <form class="join-row" id="join-form">
                <label class="visually-hidden" for="join-input">邀请码</label>
                <!-- Invite codes are served uppercase and the peer API matches
                     them exactly, so a phone keyboard that starts in lowercase
                     costs the player a failed join. Ask for capitals. -->
                <input
                  id="join-input"
                  name="code"
                  placeholder="邀请码"
                  autocomplete="off"
                  autocapitalize="characters"
                  autocorrect="off"
                  spellcheck="false"
                />
                <button class="btn btn-ghost" id="join-btn" type="submit">加入</button>
              </form>
              <p class="online-error" id="online-error" role="alert" hidden></p>
            </div>

            <div class="online-section hidden" id="online-hosting">
              <h2 class="card-title">邀请您的好友</h2>
              <div class="invite-box">
                <code class="invite-code" id="invite-code"></code>
                <button class="icon-btn" id="copy-code-btn" type="button" title="复制邀请码" aria-label="复制邀请码">
                  <i data-lucide="copy" class="icon-copy"></i>
                  <i data-lucide="check" class="icon-check hidden"></i>
                </button>
              </div>
              <button class="btn btn-primary btn-block" id="copy-link-btn" type="button">
                <i data-lucide="link"></i><span id="copy-link-label">复制邀请链接</span>
              </button>
              <p class="online-wait"><span class="spinner" aria-hidden="true"></span>等待好友加入…</p>
              <button class="btn btn-ghost btn-block" id="cancel-host-btn" type="button">取消</button>
            </div>

            <div class="online-section hidden" id="online-joining">
              <h2 class="card-title">正在加入对局</h2>
              <p class="online-wait"><span class="spinner" aria-hidden="true"></span>正在连接您的好友…</p>
              <button class="btn btn-ghost btn-block" id="cancel-join-btn" type="button">取消</button>
            </div>
          </section>

          <section class="card player-card" id="card-top">
            <span class="player-icon">
              <i data-lucide="cpu" class="icon-cpu"></i>
              <i data-lucide="user" class="icon-user hidden"></i>
            </span>
            <div class="player-info">
              <p class="player-line">
                <span class="player-name" id="top-name">电脑</span>
                <span class="player-note" id="top-caption">中等</span>
                <span class="dots" aria-hidden="true"><span></span><span></span><span></span></span>
              </p>
              <p class="player-taken">
                <span class="caps" id="captures-top"></span>
                <span class="material" id="material-top"></span>
              </p>
            </div>
            <!-- role="timer" is readable on demand but never announced, which
                 is what a value changing ten times a second wants to be. -->
            <span class="clock hidden" id="clock-top" role="timer"></span>
            <span class="turn-dot" aria-hidden="true"></span>
          </section>

          <section class="card moves-card" id="moves-card">
            <div class="card-head">
              <h2 class="card-title">着法记录</h2>
              <div class="card-actions">
                <button class="icon-btn icon-btn-sm" id="pgn-copy-btn" type="button" title="复制 PGN 棋谱" aria-label="复制 PGN 棋谱" disabled>
                  <i data-lucide="clipboard-copy"></i>
                </button>
                <button class="icon-btn icon-btn-sm" id="pgn-download-btn" type="button" title="下载 PGN 棋谱文件" aria-label="下载 PGN 棋谱文件" disabled>
                  <i data-lucide="download"></i>
                </button>
              </div>
            </div>
            <ol class="move-list" id="move-list"></ol>
            <p class="moves-empty" id="moves-empty">尚无着法 — 白方先行。</p>
            <div class="review-bar">
              <div class="review-nav" role="group" aria-label="复盘">
                <button class="icon-btn icon-btn-sm" id="review-first-btn" type="button" title="初始局面" aria-label="前往初始局面" disabled>
                  <i data-lucide="chevron-first"></i>
                </button>
                <button class="icon-btn icon-btn-sm" id="review-prev-btn" type="button" title="上一步" aria-label="后退一步" disabled>
                  <i data-lucide="chevron-left"></i>
                </button>
                <button class="icon-btn icon-btn-sm" id="review-next-btn" type="button" title="下一步" aria-label="前进一步" disabled>
                  <i data-lucide="chevron-right"></i>
                </button>
                <button class="icon-btn icon-btn-sm" id="review-last-btn" type="button" title="当前局面" aria-label="返回当前局面" disabled>
                  <i data-lucide="chevron-last"></i>
                </button>
              </div>
              <p class="review-note" id="review-note"></p>
            </div>
          </section>

          <section class="card player-card" id="card-bottom">
            <span class="player-icon"><i data-lucide="user"></i></span>
            <div class="player-info">
              <p class="player-line">
                <span class="player-name" id="bottom-name">你</span>
                <span class="player-note" id="bottom-caption">执白方</span>
              </p>
              <p class="player-taken">
                <span class="caps" id="captures-bottom"></span>
                <span class="material" id="material-bottom"></span>
              </p>
            </div>
            <span class="clock hidden" id="clock-bottom" role="timer"></span>
            <span class="turn-dot" aria-hidden="true"></span>
          </section>

          <section class="controls" id="controls">
            <div class="field-row" id="field-row">
              <label class="field" id="level-field">
                <span class="field-label">难度</span>
                <select id="level-select">
                  <option value="easy">简单</option>
                  <option value="medium" selected>中等</option>
                  <option value="hard">困难</option>
                </select>
              </label>
              <label class="field" id="time-field">
                <span class="field-label">计时</span>
                <!-- Options are built from TIME_CONTROLS in src/game/clock.js,
                     so the ids that cross the wire and land in saved games
                     have exactly one definition. -->
                <select id="time-select"></select>
              </label>
              <label class="field" id="color-field">
                <span class="field-label" id="color-label">执子</span>
                <select id="color-select">
                  <option value="w" selected>白方</option>
                  <option value="b">黑方</option>
                  <option value="random">随机</option>
                </select>
              </label>
            </div>
            <div class="button-row" id="button-row">
              <button class="btn btn-primary" id="new-game-btn" type="button">
                <i data-lucide="plus"></i>新对局
              </button>
              <button class="btn btn-ghost" id="undo-btn" type="button" disabled>
                <i data-lucide="undo-2"></i>悔棋
              </button>
              <button class="btn btn-primary hidden" id="rematch-btn" type="button">
                <i data-lucide="rotate-ccw"></i><span id="rematch-label">再来一局</span>
              </button>
              <button class="btn btn-ghost btn-danger hidden" id="resign-btn" type="button">
                <i data-lucide="flag"></i>认输
              </button>
              <button class="btn btn-ghost hidden" id="leave-btn" type="button">
                <i data-lucide="log-out"></i>离开
              </button>
            </div>
            <p class="controls-hint" id="controls-hint">执子颜色将在新对局开始时生效。</p>
          </section>
        </aside>
      </main>
    </div>

    <!-- Announces moves, check, and game results to assistive technology. -->
    <div class="visually-hidden" role="status" id="sr-status"></div>

    <!-- Transient notices (copied link, opponent events, connection errors). -->
    <div class="toast" id="toast" role="status"></div>

    <dialog class="dialog promo-dialog" id="promo-dialog" aria-labelledby="promo-title">
      <h2 class="dialog-title" id="promo-title">升变为</h2>
      <div class="promo-choices">
        <button type="button" data-promo="q" autofocus><img src="pieces/wQ.svg" alt="后" /></button>
        <button type="button" data-promo="r"><img src="pieces/wR.svg" alt="车" /></button>
        <button type="button" data-promo="b"><img src="pieces/wB.svg" alt="象" /></button>
        <button type="button" data-promo="n"><img src="pieces/wN.svg" alt="马" /></button>
      </div>
    </dialog>

    <dialog class="dialog gameover-dialog" id="gameover-dialog" aria-labelledby="gameover-title" aria-describedby="gameover-sub">
      <span class="gameover-icon" id="gameover-icon-win"><i data-lucide="trophy"></i></span>
      <span class="gameover-icon" id="gameover-icon-loss"><i data-lucide="flag"></i></span>
      <span class="gameover-icon" id="gameover-icon-draw"><i data-lucide="handshake"></i></span>
      <h2 class="dialog-title" id="gameover-title">对局结束</h2>
      <p class="dialog-sub" id="gameover-sub"></p>
      <div class="dialog-buttons">
        <button class="btn btn-primary" id="gameover-new" type="button" autofocus>新对局</button>
        <button class="btn btn-ghost" id="gameover-close" type="button">查看棋盘</button>
      </div>
    </dialog>

    <dialog class="dialog" id="confirm-dialog" aria-labelledby="confirm-title" aria-describedby="confirm-sub">
      <h2 class="dialog-title" id="confirm-title"></h2>
      <p class="dialog-sub" id="confirm-sub"></p>
      <div class="dialog-buttons">
        <button class="btn btn-danger-solid" id="confirm-yes" type="button"></button>
        <button class="btn btn-ghost" id="confirm-no" type="button" autofocus>取消</button>
      </div>
    </dialog>

    <dialog class="dialog" id="rematch-dialog" aria-labelledby="rematch-title" aria-describedby="rematch-sub">
      <h2 class="dialog-title" id="rematch-title">再来一局？</h2>
      <p class="dialog-sub" id="rematch-sub"></p>
      <div class="dialog-buttons">
        <button class="btn btn-primary" id="rematch-accept" type="button" autofocus>接受</button>
        <button class="btn btn-ghost" id="rematch-decline" type="button">拒绝</button>
      </div>
    </dialog>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
