<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>API 客户端</title>
  <meta name="description" content="在浏览器中构建、发送和测试 HTTP 请求。将请求组织到集合中、切换环境并与您的 本地账户同步。" />
  <link rel="canonical" href="https://apic.puter.com/" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="color-scheme" content="light dark" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" href="./favicon.ico" sizes="16x16 32x32 48x48" />
  <link rel="icon" href="./favicon-16x16.png" type="image/png" sizes="16x16" />
  <link rel="icon" href="./favicon-32x32.png" type="image/png" sizes="32x32" />
  <link rel="icon" href="./favicon-48x48.png" type="image/png" sizes="48x48" />
  <link rel="apple-touch-icon" href="./apple-touch-icon.png" sizes="180x180" />
  <script>
    (() => {
      let t = 'system';
      try { t = JSON.parse(localStorage.getItem('api-client:prefs') || '{}').theme || 'system'; } catch {}
      const dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.theme = t;
      document.documentElement.dataset.themeResolved = dark ? 'dark' : 'light';
      document.documentElement.style.background = dark ? '#18181b' : '#ffffff';
    })();
  </script>
  <script src="https://js.puter.com/v2/" defer></script>
  <!-- Privacy-friendly analytics by Plausible -->
  <script async src="https://plausible.io/js/pa-bQTb6WDGVBY4xIevqwEmG.js"></script>
  <script>
    window.plausible=window.plausible||function(){(plausible.q=plausible.q||[]).push(arguments)},plausible.init=plausible.init||function(i){plausible.o=i||{}};
    plausible.init()
  </script>
  <script type="module" src="/src/main.js"></script>
</head>
<body>
  <div id="app" aria-busy="true"></div>
  <noscript>API 客户端需要启用 JavaScript 才能运行。</noscript>
</body>
</html>
