<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Circuits</title>
    <meta name="description" content="在浏览器中进行原理图绘制与 PCB 布局。绘制原理图、布局电路板、覆铜、检查设计规则并导出生产文件，保存在您自己的 Puter 云端。" />
    <link rel="canonical" href="https://circuits.puter.com/" />
    <meta name="theme-color" content="#f2f2f0" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#2f2f2f" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="./favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" sizes="180x180" />
    <link rel="manifest" href="./manifest.json" />
    <script>
      // Resolve the theme before first paint to avoid a flash.
      (function () {
        var root = document.documentElement, t = 'system';
        try { t = localStorage.getItem('circuits:theme') || 'system'; } catch (e) {}
        var dark = t === 'dark' || (t === 'system' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
        root.dataset.theme = t;
        root.dataset.themeResolved = dark ? 'dark' : 'light';
      })();
    </script>
    <script src="https://js.puter.com/v2/" async onerror="window.__puterFailed = true"></script>
    <!-- Privacy-friendly analytics by Plausible -->
    <script async src="https://plausible.io/js/pa-7Zh8dRbiBvDycSDTX5G5r.js"></script>
    <script>
      window.plausible=window.plausible||function(){(plausible.q=plausible.q||[]).push(arguments)},plausible.init=plausible.init||function(i){plausible.o=i||{}};
      plausible.init()
    </script>
    <script type="module" src="/src/main.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">跳转到设计画布</a>
    <div id="app" aria-busy="true"></div>
    <div id="live-region" class="sr-only" aria-live="polite" aria-atomic="true"></div>
    <noscript>Circuits 需要启用 JavaScript 才能运行。</noscript>
  </body>
</html>
