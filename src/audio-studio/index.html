<!doctype html>
<html lang="zh-CN" data-theme-resolved="dark">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Resolve the theme before first paint to avoid a flash.
      try {
        var t = (JSON.parse(localStorage.getItem('audio-studio:prefs') || '{}').theme) || 'system';
        var dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.themeResolved = dark ? 'dark' : 'light';
      } catch (e) {}
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#161616" />

    <meta name="keywords" content="在线音频编辑器, 多轨音频编辑器, 波形编辑器, 频谱编辑器, 降噪, 在线录音, 播客编辑器, Puter 应用" />
