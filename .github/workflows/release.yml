name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release Tag (e.g. v0.0.1)'
        required: false
        default: 'v0.0.1'

permissions:
  contents: write
  packages: write

jobs:
  build-docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=raw,value=0.0.1

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Export Docker Image Tar for NAS
        run: |
          docker build -t everything-suite:0.0.1 -f Dockerfile .
          docker save everything-suite:0.0.1 | gzip > everything-suite-0.0.1-docker-nas.tar.gz

      - name: Upload Docker Image Tar
        uses: actions/upload-artifact@v4
        with:
          name: everything-suite-docker-nas
          path: everything-suite-0.0.1-docker-nas.tar.gz
          retention-days: 7

  build-macos:
    name: Build macOS DMG (arm64)
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build macOS DMG
        run: |
          chmod +x scripts/desktop/build-dmg.sh
          ./scripts/desktop/build-dmg.sh all-in-one
          mv release-dmg/*.dmg release-dmg/Everything-0.0.1-macOS-arm64.dmg

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: everything-macos-arm64-dmg
          path: release-dmg/Everything-0.0.1-macOS-arm64.dmg
          retention-days: 7

  build-windows:
    name: Build Windows EXE (x64)
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build Windows EXE
        shell: bash
        run: |
          chmod +x scripts/desktop/build-exe.sh
          ./scripts/desktop/build-exe.sh all-in-one
          mv release-exe/*.exe release-exe/Everything-0.0.1-Windows-Setup-x64.exe

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: everything-windows-x64-exe
          path: release-exe/Everything-0.0.1-Windows-Setup-x64.exe
          retention-days: 7

  publish-release:
    name: Create GitHub Release
    needs: [build-docker, build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Prepare Release Files
        run: |
          mkdir -p ./release-dist
          find ./artifacts -type f -exec cp {} ./release-dist/ \;
          ls -lh ./release-dist/

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: v0.0.1
        run: |
          gh release delete "$TAG_NAME" -y 2>/dev/null || true
          gh release create "$TAG_NAME" ./release-dist/* \
            --title "Everything 全套开源软件中文版 $TAG_NAME" \
            --notes "### 🎉 Everything 全开源软件中文版 $TAG_NAME 发布！"
