name: Release Artifacts (v0.0.1)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release Tag Version (e.g. v0.0.1)'
        required: true
        default: 'v0.0.1'

permissions:
  contents: write
  packages: write

jobs:
  # ============================================================================
  # 1. 构建 Docker 镜像并发布到 GitHub Container Registry (ghcr.io)
  # ============================================================================
  build-docker:
    name: Build & Push Docker Image (NAS / Server)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=raw,value=0.0.1
            type=raw,value=${{ github.event.inputs.tag || github.ref_name }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Export Docker Image Tar (for manual NAS offline import)
        run: |
          docker build -t everything-suite:0.0.1 -f Dockerfile .
          docker save everything-suite:0.0.1 | gzip > everything-suite-0.0.1-docker-nas.tar.gz

      - name: Upload Docker Image Tar Artifact
        uses: actions/upload-artifact@v4
        with:
          name: everything-suite-docker-nas
          path: everything-suite-0.0.1-docker-nas.tar.gz
          retention-days: 7

  # ============================================================================
  # 2. 构建 macOS DMG 安装包 (Apple Silicon arm64 架构)
  # ============================================================================
  build-macos:
    name: Build macOS DMG (Apple Silicon arm64)
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build macOS Apple Silicon DMG
        run: |
          chmod +x scripts/desktop/build-dmg.sh
          # 构建聚合全套软件的桌面安装包
          ./scripts/desktop/build-dmg.sh all-in-one
          # 重命名以便于辨识版本
          mv release-dmg/*.dmg release-dmg/Everything-0.0.1-macOS-arm64.dmg

      - name: Upload macOS DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: everything-macos-arm64-dmg
          path: release-dmg/Everything-0.0.1-macOS-arm64.dmg
          retention-days: 7

  # ============================================================================
  # 3. 构建 Windows EXE 安装包 (64位 x64 架构)
  # ============================================================================
  build-windows:
    name: Build Windows EXE (x64)
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build Windows x64 NSIS Installer
        shell: bash
        run: |
          chmod +x scripts/desktop/build-exe.sh
          # 构建聚合全套软件的桌面安装包
          ./scripts/desktop/build-exe.sh all-in-one
          # 重命名以便于辨识版本
          mv release-exe/*.exe release-exe/Everything-0.0.1-Windows-Setup-x64.exe

      - name: Upload Windows EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: everything-windows-x64-exe
          path: release-exe/Everything-0.0.1-Windows-Setup-x64.exe
          retention-days: 7

  # ============================================================================
  # 4. 发布 GitHub Release 并挂载全部产物
  # ============================================================================
  publish-release:
    name: Create GitHub Release & Upload Assets
    needs: [build-docker, build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download all workflow artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Prepare Release Files
        run: |
          mkdir -p ./release-dist
          find ./artifacts -type f -exec cp {} ./release-dist/ \;
          ls -lh ./release-dist/

      - name: Create or Update GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.event.inputs.tag || github.ref_name || 'v0.0.1' }}
        run: |
          gh release create "$TAG_NAME" ./release-dist/* \
            --title "Everything 全套开源软件中文版 $TAG_NAME" \
            --notes "### 🎉 Everything 全开源软件中文版 $TAG_NAME 正式发布！

本项目涵盖全部 51 款日常与专业软件（电子表格、文档、PPT、白板、Photoshop、AutoCAD、音乐制作、视频剪辑、待办、项目管理等），全界面文案已完成 100% 深度中文汉化。

#### 📦 本次构建产物：
1. **NAS / Docker 镜像包**:
   - `everything-suite-0.0.1-docker-nas.tar.gz`（下载后可在群晖/威联通/Unraid 等 NAS 直接导入使用）
   - 也支持直接从 GitHub Container Registry 拉取：\`docker pull ghcr.io/${{ github.repository }}:0.0.1\`
2. **macOS 原生桌面安装包**:
   - `Everything-0.0.1-macOS-arm64.dmg`（专门为 Apple Silicon M1/M2/M3/M4 系列芯片优化）
3. **Windows 桌面安装包**:
   - `Everything-0.0.1-Windows-Setup-x64.exe`（支持 64位 Windows 10/11 本地独立离线运行）

---
*全套软件遵循 MIT 开源协议。*"
