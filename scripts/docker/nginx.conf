server {
    listen 80;
    server_name localhost;

    # 启用 gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml application/wasm;
    gzip_vary on;
    gzip_min_length 1024;

    # 解决部分 WASM / 跨域隔离安全头要求
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Cross-Origin-Embedder-Policy require-corp always;

    # 根路径：主导航门户页面
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # 各个独立软件子路由 (例如 /app/spreadsheet/ -> /usr/share/nginx/html/app/spreadsheet/index.html)
    location ~ ^/app/([^/]+)(/.*)?$ {
        alias /usr/share/nginx/html/app/$1;
        index index.html;
        try_files $2 $2/ /app/$1/index.html =404;
    }
}
